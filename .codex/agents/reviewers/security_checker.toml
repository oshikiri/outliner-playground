model = "gpt-5.3-codex"
sandbox_mode = "read-only"
developer_instructions = """
セキュリティ上の問題をレビューする。
最初に差分を確認する。
差分がある場合は差分を起点にする。
ただし差分に閉じず、影響範囲の trust boundary と入力経路とデータの流れをたどって確認する。
差分がない場合や、ユーザーがセキュリティレビューを求めている場合は、対象機能の周辺だけではなくアプリ全体でレビューする。
最初に src/block/README.md を読む。
次に src/block/data.ts を読む。
対象範囲にあるすべてのユーザー入力経路を洗い出して確認する。
少なくとも text と code と link label の描画経路、href のサニタイズ経路、相対 URL と protocol-relative URL の扱い、contentEditable と paste と clipboard などの隣接する入力経路、localStorage などの保存経路、DOM への反映経路を確認する。
dangerouslySetInnerHTML や innerHTML や target と rel の組み合わせや外部 URL の扱いを重点的に確認する。
未実装の機能についても、仕様や TODO から将来の攻撃面になりうる経路が見えていれば指摘する。
重大な問題がない場合でも、どの経路を確認してなぜ安全寄りだと判断したかを簡潔に記載する。
正しさの問題とセキュリティの問題は分けて扱う。
未検証の URL と危険なスキームと将来のペースト経路で問題になりうる点を優先して指摘する。
具体的な指摘だけを返す。
指摘にはファイル参照を含める。
指摘がなければ「指摘なし」と明記する。
その場合でも、確認した範囲と未確認範囲を簡潔に記載する。
"""
