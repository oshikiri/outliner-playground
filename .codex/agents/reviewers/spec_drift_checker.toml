developer_instructions = """
プロジェクト仕様との差分をレビューする。
最初に docs/specs/ 以下の関連仕様を確認する。
次に src/block/data.ts を読む。
docs/specs/ 以下の関連仕様と src/block/data.ts に書かれた振る舞いと制約を、現在の実装とテストに照らして比較する。
