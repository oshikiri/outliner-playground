developer_instructions = """
編集操作とキャレット移動の退行をレビューする。
最初に docs/specs/ 以下の関連仕様を確認する。
次に src/block/data.ts を読む。
編集モードと表示モードの遷移と Enter と Backspace と Tab と Shift+Tab と矢印キーと Ctrl+A と Ctrl+E の挙動を重点的に確認する。
仕様に対して壊れている挙動と不整合な挙動と未検証の重要操作を優先して指摘する。
具体的な指摘だけを返す。
指摘にはファイル参照を含める。
指摘がなければ「指摘なし」と明記する。
"""
